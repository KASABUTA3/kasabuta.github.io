<svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aa8c2a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Car body -->
  <path d="M 40 60 L 50 40 L 90 40 L 110 60 L 170 60 L 170 85 L 40 85 Z"
        fill="none" stroke="url(#carGradient)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Windshield -->
  <path d="M 55 60 L 60 45 L 85 45 L 95 60"
        fill="none" stroke="url(#carGradient)" stroke-width="2"/>

  <!-- Front wheel -->
  <circle cx="65" cy="85" r="15" fill="none" stroke="url(#carGradient)" stroke-width="3"/>
  <circle cx="65" cy="85" r="8" fill="none" stroke="url(#carGradient)" stroke-width="2"/>

  <!-- Rear wheel -->
  <circle cx="145" cy="85" r="15" fill="none" stroke="url(#carGradient)" stroke-width="3"/>
  <circle cx="145" cy="85" r="8" fill="none" stroke="url(#carGradient)" stroke-width="2"/>

  <!-- Details -->
  <line x1="110" y1="60" x2="110" y2="85" stroke="url(#carGradient)" stroke-width="2"/>
</svg>
