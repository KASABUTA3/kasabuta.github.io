<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aa8c2a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGradient)" stroke-width="2"/>

  <!-- K letter stylized -->
  <text x="100" y="130" font-family="serif" font-size="120" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="0.1em">K</text>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#goldGradient)" stroke-width="1" opacity="0.3"/>
</svg>
