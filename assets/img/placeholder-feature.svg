<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="featureGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#aa8c2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="20" y="20" width="160" height="160" rx="10" fill="none" stroke="url(#featureGradient)" stroke-width="3"/>

  <!-- Inner design - star pattern -->
  <polygon points="100,50 110,80 140,85 115,105 120,135 100,120 80,135 85,105 60,85 90,80"
           fill="none" stroke="url(#featureGradient)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Center circle -->
  <circle cx="100" cy="100" r="25" fill="none" stroke="url(#featureGradient)" stroke-width="2"/>

  <!-- Corner accents -->
  <line x1="35" y1="35" x2="45" y2="35" stroke="url(#featureGradient)" stroke-width="2"/>
  <line x1="35" y1="35" x2="35" y2="45" stroke="url(#featureGradient)" stroke-width="2"/>

  <line x1="165" y1="35" x2="155" y2="35" stroke="url(#featureGradient)" stroke-width="2"/>
  <line x1="165" y1="35" x2="165" y2="45" stroke="url(#featureGradient)" stroke-width="2"/>

  <line x1="35" y1="165" x2="45" y2="165" stroke="url(#featureGradient)" stroke-width="2"/>
  <line x1="35" y1="165" x2="35" y2="155" stroke="url(#featureGradient)" stroke-width="2"/>

  <line x1="165" y1="165" x2="155" y2="165" stroke="url(#featureGradient)" stroke-width="2"/>
  <line x1="165" y1="165" x2="165" y2="155" stroke="url(#featureGradient)" stroke-width="2"/>
</svg>
